# ============================================================
# Настройки установки MacAtlas
# Заполняйте по желанию. Пустое значение = установщик
# сгенерирует надёжный пароль сам и покажет его в конце.
# ============================================================

# Домен, на котором будет работать система (для nginx и SSL)
DOMAIN="domen.ru"

# Получить бесплатный SSL-сертификат Let's Encrypt?
# Требование: DNS-запись DOMAIN уже должна смотреть на этот сервер.
# yes / no
SSL="no"

# ---------- База данных ----------
# Хост MariaDB. 127.0.0.1/localhost — локальная БД: установщик сам поставит
# mariadb-server на этот сервер, создаст базу и пользователя.
# Любой другой адрес — УДАЛЁННАЯ БД: сервер MariaDB и пользователь уже
# существуют на том хосте (вы их поднимаете заранее сами), установщик лишь
# проверит соединение (и зальёт таблицы, если DB_IMPORT=yes).
# На этом сервере при удалённой БД ставится только консольный клиент mysql
# (пакет mariadb, БЕЗ mariadb-server) — он нужен для импорта дампа.
DB_HOST="127.0.0.1"

# Имя базы и пользователь БД
DB_NAME="macatlas"
DB_USER="macatlas"

# Пароль пользователя БД (пусто = сгенерировать; для удалённой БД
# укажите существующий пароль — генерировать будет нечего)
DB_PASSWORD=""

# Заливать ли таблицы из дампа bd/macatlas.sql?
#   yes — свежая установка (пустая база)
#   no  — таблицы уже есть (залиты вручную или база переезжает)
DB_IMPORT="yes"

# Пароль root MariaDB (только для ЛОКАЛЬНОЙ базы; пусто = сгенерировать;
# на свежей MariaDB root ходит через unix_socket, пароль нужен для удалённого доступа)
MYSQL_ROOT_PASSWORD=""

# Ключ AES-256 для шифрования паролей устройств в базе (key.master_key).
# Пусто = сгенерировать уникальный при установке (рекомендуется!).
# Заполнить вручную нужно только при ПЕРЕНОСЕ существующей базы —
# ключ должен совпадать с тем, которым зашифрованы пароли в дампе.
# После установки менять нельзя: креды станут нечитаемы.
MASTER_KEY=""

# Пароль учётной записи root в MacAtlas (веб-интерфейс).
# Пусто = сгенерировать (покажется в /root/macatlas-credentials.txt).
ADMIN_PASSWORD=""

# Создать учётную запись demo/demo (только просмотр)?
# Нужна только для демо-стендов. ВНИМАНИЕ: это всем известный
# логин-пароль — на боевой установке держите выключенной.
# yes / no
CREATE_DEMO="no"
